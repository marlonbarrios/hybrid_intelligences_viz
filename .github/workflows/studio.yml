name: Studio publish

on:
  workflow_dispatch:
    inputs:
      job:
        description: Path to ingest/jobs/*.json
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publish from Studio
        id: publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/studio-publish.js --job "${{ inputs.job }}"
      - name: Commit Hub files
        run: |
          git config user.name "Marlon Barrios Solano"
          git config user.email "marlonbarrios@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Hub files changed."
            exit 0
          fi
          MSG="${{ steps.publish.outputs.commit_message }}"
          if [ -z "$MSG" ]; then MSG="Update the Hub from Studio."; fi
          git commit -m "$MSG"
          git push
