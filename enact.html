<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Intelligences — Enact</title>
  <meta name="description" content="Cognitive prompts for a choreography of awareness — Hybrid Intelligences invitations in the spirit of Oblique Strategies.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1018;
      --panel: #12141e;
      --border: #323848;
      --title: #f4c430;
      --text: #e8eaef;
      --muted: #969eb0;
      --link: #82c3ff;
      --cta-fg: #0e1018;
    }
    body.light-mode {
      --bg: #fffdf8;
      --panel: #ffffff;
      --border: #d2d6e0;
      --title: #a8760c;
      --text: #202430;
      --muted: #5a6070;
      --link: #125599;
      --cta-fg: #fffdf8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .site-logo { display: block; line-height: 0; text-decoration: none; }
    .site-logo:hover { opacity: 0.88; text-decoration: none; }
    .site-logo img { display: block; height: 52px; width: auto; }
    .eyebrow {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--title);
    }
    .focus-panel {
      margin: 0 1.5rem 0.5rem;
      max-width: 40rem;
      padding: 1rem 1.25rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      text-align: left;
    }
    .focus-kicker {
      margin: 0 0 0.35rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--title);
    }
    .focus-title {
      margin: 0 0 0.45rem;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--text);
    }
    .focus-title a { color: var(--link); text-decoration: none; }
    .focus-title a:hover { text-decoration: underline; }
    .focus-def {
      margin: 0 0 0.55rem;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .focus-note {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: var(--title);
    }
    .card-source {
      margin: 0 auto 0.85rem;
      max-width: 16em;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      color: var(--title);
    }
    .header-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 0.95rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      align-items: center;
    }
    .theme-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .theme-btn:hover { color: var(--title); border-color: var(--title); }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1.5rem 1.35rem;
      pointer-events: none;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    .dock-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      justify-content: center;
    }
    .lang-select {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      max-width: min(16rem, 86vw);
    }
    .lang-select:hover { border-color: var(--title); color: var(--title); }
    .sound-btn {
      pointer-events: auto;
      border: 1px solid var(--title);
      background: var(--panel);
      color: var(--title);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .sound-btn:hover { color: var(--title); border-color: var(--title); }
    .sound-btn[aria-pressed="false"] {
      border-color: var(--border);
      color: var(--muted);
    }
    .hint {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem 8vw 7.5rem;
      cursor: pointer;
      user-select: none;
    }
    .stage:focus { outline: none; }
    #card {
      margin: 0 auto;
      max-width: 16em;
      font-family: "Bricolage Grotesque", "IBM Plex Sans", "Noto Sans", "Hiragino Sans", "PingFang SC", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: clamp(2.05rem, 7.2vw, 5.1rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
      text-wrap: pretty;
      color: var(--text);
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    #card.is-out { opacity: 0; }
    #card.is-awaiting {
      opacity: 0.55;
      font-size: clamp(1.1rem, 3.2vw, 1.45rem);
      font-family: "IBM Plex Mono", monospace;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.45;
      max-width: 22em;
      color: var(--muted);
      text-align: center;
    }
    #card.is-streaming::after {
      content: "▍";
      margin-left: 0.06em;
      font-weight: 400;
      opacity: 0.42;
      animation: enact-caret 1.05s steps(1) infinite;
    }
    @keyframes enact-caret {
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #card { transition: none; }
      #card.is-streaming::after { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <a class="site-logo" href="index.html" aria-label="Hybrid Intelligences home">
        <img src="logo.png" alt="Hybrid Intelligences">
      </a>
      <p class="eyebrow">Enact</p>
    </div>
    <div class="header-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
        <a href="essays.html">Essays</a>
        <a href="videos.html">Videos</a>
      <a href="ontology.html">Ontology</a>
      <a href="views.html">Views</a>
      <a href="voice.html">Voice</a>
      <a href="mini-pod.html">Mini-pod</a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle theme">Theme</button>
    </div>
  </header>

  <section class="focus-panel" id="focusPanel" hidden aria-label="Ontology source">
    <p class="focus-kicker">Ontology source</p>
    <h2 class="focus-title" id="focusTitle"></h2>
    <p class="focus-def" id="focusDef"></p>
    <p class="focus-note">Each invitation below is generated from this entry.</p>
  </section>

  <main class="stage" id="stage" tabindex="0" role="button" aria-label="Show another invitation">
    <p class="card-source" id="cardSource" hidden></p>
    <p id="card" class="is-out" aria-live="polite"></p>
  </main>
  <div class="dock">
    <div class="dock-row">
      <label class="visually-hidden" for="langSelect">Language</label>
      <select id="langSelect" class="lang-select" aria-label="Language"></select>
      <button type="button" class="sound-btn" id="soundBtn" aria-pressed="true" aria-label="Turn sound off">Sound on</button>
    </div>
    <p class="hint" id="hint">Press Space for your first invitation.</p>
  </div>

  <script src="realtime-config.js"></script>
  <script>
    const LANGUAGES = [
      { id: "en", name: "English", native: "English" },
      { id: "es", name: "Spanish", native: "Español" },
      { id: "pt", name: "Portuguese", native: "Português" },
      { id: "fr", name: "French", native: "Français" },
      { id: "de", name: "German", native: "Deutsch" },
      { id: "it", name: "Italian", native: "Italiano" },
      { id: "nl", name: "Dutch", native: "Nederlands" },
      { id: "pl", name: "Polish", native: "Polski" },
      { id: "sv", name: "Swedish", native: "Svenska" },
      { id: "el", name: "Greek", native: "Ελληνικά" },
      { id: "ru", name: "Russian", native: "Русский" },
      { id: "uk", name: "Ukrainian", native: "Українська" },
      { id: "tr", name: "Turkish", native: "Türkçe" },
      { id: "ar", name: "Arabic", native: "العربية", rtl: true },
      { id: "he", name: "Hebrew", native: "עברית", rtl: true },
      { id: "fa", name: "Persian", native: "فارسی", rtl: true },
      { id: "hi", name: "Hindi", native: "हिन्दी" },
      { id: "bn", name: "Bengali", native: "বাংলা" },
      { id: "ur", name: "Urdu", native: "اردو", rtl: true },
      { id: "zh", name: "Chinese (Simplified)", native: "简体中文" },
      { id: "zh-Hant", name: "Chinese (Traditional)", native: "繁體中文" },
      { id: "ja", name: "Japanese", native: "日本語" },
      { id: "ko", name: "Korean", native: "한국어" },
      { id: "vi", name: "Vietnamese", native: "Tiếng Việt" },
      { id: "th", name: "Thai", native: "ไทย" },
      { id: "id", name: "Indonesian", native: "Bahasa Indonesia" },
      { id: "sw", name: "Swahili", native: "Kiswahili" },
    ];

    const FADE_MS = 700;
    const recent = [];
    let busy = false;
    let gestured = false;
    let hasGenerated = false;
    let heardCurrent = false;
    let soundOn = localStorage.getItem("hi-enact-sound") !== "off";
    let speakGen = 0;
    let objectUrl = "";
    let pc = null;
    let dc = null;
    let remoteAudio = null;
    let silentCtx = null;
    let voiceConnecting = null;
    const card = document.getElementById("card");
    const hint = document.getElementById("hint");
    const focusPanel = document.getElementById("focusPanel");
    const focusTitle = document.getElementById("focusTitle");
    const focusDef = document.getElementById("focusDef");
    const cardSource = document.getElementById("cardSource");
    const soundBtn = document.getElementById("soundBtn");
    const langSelect = document.getElementById("langSelect");
    let currentLang = LANGUAGES[0];
    let focusConceptId = "";
    let focusConceptName = "";
    let focusConceptDef = "";
    let focusConceptCat = "";
    let focusConceptRelated = [];
    const player = new Audio();
    player.preload = "auto";

    function params() {
      const q = new URLSearchParams(location.search);
      return {
        id: (q.get("id") || q.get("talk") || "").trim().toLowerCase().replace(/[^a-z0-9_]/g, ""),
        name: (q.get("name") || "").trim(),
      };
    }

    function showFocusPanel(label, definition, category) {
      focusPanel.hidden = false;
      focusTitle.innerHTML =
        "<a href=\"ontology.html#" + encodeURIComponent(focusConceptId) + "\">" +
        String(label || focusConceptName).replace(/</g, "&lt;") +
        "</a>";
      if (category) {
        focusDef.textContent = category + " · " + (definition || "");
      } else {
        focusDef.textContent = definition || "";
      }
      updateCardSource();
    }

    function updateCardSource() {
      if (!focusConceptId || !hasGenerated) {
        cardSource.hidden = true;
        cardSource.textContent = "";
        return;
      }
      cardSource.hidden = false;
      cardSource.textContent = "Generated from ontology · " + focusConceptName;
    }

    function awaitingMessage() {
      if (focusConceptId) {
        return "Press Space to generate an invitation from this ontology entry.";
      }
      return "Press Space for your first invitation.";
    }

    function showAwaitingCard() {
      card.classList.add("is-awaiting");
      card.classList.remove("is-out", "is-streaming");
      card.textContent = awaitingMessage();
    }

    function initFocusConcept() {
      const { id, name } = params();
      if (!id) return;
      focusConceptId = id;
      focusConceptName = name || id.replace(/_/g, " ");
      document.title = "Enact · " + focusConceptName + " — Hybrid Intelligences";
      showFocusPanel(focusConceptName, "", "");
    }

    function enactRequestBody() {
      const body = {
        recent: recent.slice(-8),
        language: currentLang.name,
        languageNative: currentLang.native,
      };
      if (!focusConceptId) return body;
      body.conceptId = focusConceptId;
      body.id = focusConceptId;
      body.conceptName = focusConceptName;
      body.name = focusConceptName;
      if (focusConceptDef) body.definition = focusConceptDef;
      if (focusConceptCat) body.category = focusConceptCat;
      if (focusConceptRelated.length) body.related = focusConceptRelated;
      return body;
    }

    function localId(iri) {
      if (!iri) return "";
      const value = typeof iri === "string" ? iri : iri["@id"] || "";
      return (value.split("#")[1] || "").replace(/^category\//, "");
    }

    function textOf(value) {
      if (!value) return "";
      if (typeof value === "string") return value;
      if (Array.isArray(value)) return textOf(value[0]);
      if (typeof value === "object") return value["@value"] || "";
      return String(value);
    }

    async function loadFocusFromOntology() {
      if (!focusConceptId) return;
      try {
        const res = await fetch("ontology.jsonld");
        const data = await res.json();
        const graph = data["@graph"] || [];
        const item = graph.find((entry) => localId(entry["@id"]) === focusConceptId);
        if (!item) return;
        const label = textOf(item["skos:prefLabel"]) || focusConceptName;
        const definition = textOf(item["skos:definition"]);
        const category = item["hi:category"] || "";
        focusConceptName = label;
        focusConceptDef = definition;
        focusConceptCat = category;
        focusConceptRelated = []
          .concat(item["skos:related"] || [])
          .map((rel) => {
            const relId = localId(rel);
            const relItem = graph.find((entry) => localId(entry["@id"]) === relId);
            return relItem ? textOf(relItem["skos:prefLabel"]) : relId;
          })
          .filter(Boolean)
          .slice(0, 8);
        document.title = "Enact · " + label + " — Hybrid Intelligences";
        showFocusPanel(label, definition, category);
      } catch (_) {}
    }

    function applyTheme(mode) {
      document.body.classList.toggle("light-mode", mode === "light");
      localStorage.setItem("hi-theme", mode);
    }

    function initTheme() {
      const saved = localStorage.getItem("hi-theme");
      const mode = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      applyTheme(mode);
      document.getElementById("themeBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        applyTheme(document.body.classList.contains("light-mode") ? "dark" : "light");
      });
    }

    function findLanguage(id) {
      return LANGUAGES.find((l) => l.id === id) || LANGUAGES[0];
    }

    function browserLanguageId() {
      const nav = String(navigator.language || navigator.userLanguage || "en").toLowerCase();
      if (nav.startsWith("zh-hant") || nav.startsWith("zh-tw") || nav.startsWith("zh-hk")) return "zh-Hant";
      if (nav.startsWith("zh")) return "zh";
      const short = nav.split("-")[0];
      if (LANGUAGES.some((l) => l.id === nav)) return nav;
      const match = LANGUAGES.find((l) => l.id === short);
      return match ? match.id : "en";
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("hi-enact-lang", lang.id);
      document.documentElement.lang = lang.id === "zh-Hant" ? "zh-Hant" : lang.id;
      card.setAttribute("dir", lang.rtl ? "rtl" : "ltr");
      langSelect.value = lang.id;
    }

    function fillLanguages() {
      langSelect.innerHTML = LANGUAGES.map((lang) => {
        const label = lang.id === "en" ? lang.native : lang.native + " · " + lang.name;
        return "<option value=\"" + lang.id + "\">" + label + "</option>";
      }).join("");
      applyLanguage(findLanguage(localStorage.getItem("hi-enact-lang") || browserLanguageId()));
    }

    function syncSoundButton() {
      soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
      soundBtn.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
      soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
    }

    function idleHint() {
      if (!hasGenerated) {
        hint.textContent = focusConceptId
          ? "Press Space to generate from " + focusConceptName + "."
          : "Press Space for your first invitation.";
        return;
      }
      if (!soundOn) {
        hint.textContent = "Press Space for another invitation.";
        return;
      }
      hint.textContent = heardCurrent
        ? "Press Space for another invitation."
        : "Press Space to hear it. Press again for another.";
    }

    function remember(text) {
      if (!text) return;
      recent.push(text);
      if (recent.length > 12) recent.shift();
    }

    function apiUrl(path) {
      if (location.protocol === "file:") return "";
      const host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1" || host.endsWith("vercel.app")) return path;
      const origin = String(window.HI_REALTIME_ORIGIN || "https://project-s4uzk.vercel.app").replace(/\/+$/, "");
      return origin + path;
    }

    function enactUrl() {
      let url = apiUrl("/api/enact");
      if (url && focusConceptId) {
        url += (url.includes("?") ? "&" : "?") + "id=" + encodeURIComponent(focusConceptId);
      }
      return url;
    }

    function speechUrl() {
      return apiUrl("/api/speech");
    }

    function tokenUrl() {
      const base = apiUrl("/api/token");
      if (!base) return "";
      return base + (base.includes("?") ? "&" : "?") + "mode=enact";
    }

    function fadeMs() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : FADE_MS;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fadeOut() {
      if (card.classList.contains("is-out")) return;
      card.classList.add("is-out");
      await wait(fadeMs());
    }

    function stopSpeak() {
      speakGen += 1;
      try {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({ type: "response.cancel" }));
        }
      } catch (_) {}
      try { player.pause(); } catch (_) {}
      player.removeAttribute("src");
      try { player.load(); } catch (_) {}
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = "";
      }
      if (window.speechSynthesis) speechSynthesis.cancel();
    }

    function teardownVoice() {
      if (dc) {
        try { dc.close(); } catch (_) {}
      }
      if (pc) {
        try { pc.close(); } catch (_) {}
      }
      if (remoteAudio) {
        try { remoteAudio.pause(); } catch (_) {}
        remoteAudio.srcObject = null;
      }
      if (silentCtx) {
        try { silentCtx.close(); } catch (_) {}
      }
      dc = null;
      pc = null;
      remoteAudio = null;
      silentCtx = null;
    }

    function silentTrack() {
      silentCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = silentCtx.createMediaStreamDestination();
      const gain = silentCtx.createGain();
      gain.gain.value = 0;
      const osc = silentCtx.createOscillator();
      osc.connect(gain);
      gain.connect(dest);
      osc.start();
      return dest.stream;
    }

    function waitForDataChannel() {
      return new Promise((resolve, reject) => {
        if (!dc) {
          reject(new Error("Voice channel was not created."));
          return;
        }
        if (dc.readyState === "open") {
          resolve();
          return;
        }
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Voice channel timed out."));
        }, 15000);
        function cleanup() {
          clearTimeout(timer);
          dc.removeEventListener("open", onOpen);
          dc.removeEventListener("error", onError);
        }
        function onOpen() {
          cleanup();
          resolve();
        }
        function onError() {
          cleanup();
          reject(new Error("Voice channel failed."));
        }
        dc.addEventListener("open", onOpen);
        dc.addEventListener("error", onError);
      });
    }

    async function connectVoice() {
      teardownVoice();
      const url = tokenUrl();
      if (!url) throw new Error("No token URL");
      const tokenRes = await fetch(url);
      const tokenData = await tokenRes.json();
      if (!tokenRes.ok || !tokenData.value) {
        throw new Error(tokenData.error || "Could not get a realtime token.");
      }
      const sendStream = silentTrack();
      if (silentCtx && silentCtx.state === "suspended") await silentCtx.resume();
      pc = new RTCPeerConnection();
      remoteAudio = document.createElement("audio");
      remoteAudio.autoplay = true;
      remoteAudio.setAttribute("playsinline", "");
      pc.ontrack = (e) => {
        remoteAudio.srcObject = e.streams[0] || new MediaStream([e.track]);
        remoteAudio.play().catch(() => {});
      };
      sendStream.getTracks().forEach((track) => pc.addTrack(track, sendStream));
      dc = pc.createDataChannel("oai-events");
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const sdpResponse = await fetch("https://api.openai.com/v1/realtime/calls", {
        method: "POST",
        body: offer.sdp,
        headers: {
          Authorization: "Bearer " + tokenData.value,
          "Content-Type": "application/sdp",
        },
      });
      if (!sdpResponse.ok) throw new Error("OpenAI did not accept the voice session.");
      await pc.setRemoteDescription({
        type: "answer",
        sdp: await sdpResponse.text(),
      });
      await waitForDataChannel();
    }

    async function ensureVoice() {
      if (dc && dc.readyState === "open") return;
      if (voiceConnecting) {
        await voiceConnecting;
        if (dc && dc.readyState === "open") return;
      }
      voiceConnecting = connectVoice().finally(() => {
        voiceConnecting = null;
      });
      await voiceConnecting;
    }

    function speakWithModel(text) {
      if (!dc || dc.readyState !== "open") return false;
      dc.send(JSON.stringify({
        type: "response.create",
        response: {
          instructions: "Speak this invitation exactly in " + currentLang.name + ", and nothing else:\n\n" + text,
        },
      }));
      return true;
    }

    async function speakWithTts(text) {
      const url = speechUrl();
      if (!url) return false;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, language: currentLang.name }),
      });
      if (!res.ok) return false;
      const blob = await res.blob();
      objectUrl = URL.createObjectURL(blob);
      player.src = objectUrl;
      await player.play();
      return true;
    }

    async function speak(text) {
      if (!soundOn || !text) return;
      stopSpeak();
      const gen = speakGen;
      try {
        await ensureVoice();
        if (gen !== speakGen) return;
        if (speakWithModel(text)) return;
      } catch (_) {}
      if (gen !== speakGen) return;
      try {
        if (await speakWithTts(text)) return;
      } catch (_) {}
    }

    function showPartial(raw) {
      return String(raw || "").replace(/^["“]+/, "").replace(/\s+/g, " ");
    }

    function finishCard(raw) {
      return showPartial(raw).replace(/["”]+$/g, "").replace(/^\s*card\s*\d*[:.\-]\s*/i, "").trim();
    }

    async function typeOntoCard(text) {
      const finalText = finishCard(text);
      if (!finalText) return "";
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        card.textContent = finalText;
        return finalText;
      }
      card.classList.add("is-streaming");
      const parts = finalText.split(/(\s+)/);
      let shown = "";
      for (const part of parts) {
        shown += part;
        card.textContent = shown;
        if (part.trim()) await wait(Math.min(70, 28 + part.length * 4));
      }
      card.classList.remove("is-streaming");
      card.textContent = finalText;
      return finalText;
    }

    async function streamOntoCard() {
      const url = enactUrl();
      if (!url) return { text: "", error: "No API URL." };
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: focusConceptId ? "application/json" : "text/plain",
        },
        body: JSON.stringify(enactRequestBody()),
      });
      if (!res.ok) {
        let message = "Could not generate from the ontology.";
        try {
          const data = await res.json();
          message = data.error || message;
        } catch (_) {}
        return { text: "", error: message };
      }
      const type = res.headers.get("content-type") || "";
      if (type.includes("application/json")) {
        const data = await res.json();
        if (!data.prompt) return { text: "", error: data.error || "The card was empty." };
        const text = await typeOntoCard(data.prompt);
        if (data.label) focusConceptName = data.label;
        updateCardSource();
        return { text, error: "" };
      }
      if (!res.body) return { text: "", error: "No response body." };
      card.classList.add("is-streaming");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      let pieces = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const piece = decoder.decode(value, { stream: true });
        if (!piece) continue;
        pieces += 1;
        full += piece;
        card.textContent = showPartial(full);
      }
      card.classList.remove("is-streaming");
      const text = finishCard(full);
      if (!text) return { text: "", error: "The card was empty." };
      if (pieces <= 1) {
        const typed = await typeOntoCard(text);
        updateCardSource();
        return { text: typed, error: "" };
      }
      card.textContent = text;
      updateCardSource();
      return { text, error: "" };
    }

    async function nextCard() {
      if (busy) return;
      busy = true;
      stopSpeak();
      heardCurrent = false;
      hint.textContent = focusConceptId
        ? "Generating from " + focusConceptName + "…"
        : "Generating your invitation…";
      if (hasGenerated) {
        await fadeOut();
        card.textContent = "";
      }
      card.classList.remove("is-out", "is-awaiting");
      let text = "";
      let error = "";
      try {
        const result = await streamOntoCard();
        text = result.text;
        error = result.error;
      } catch (err) {
        error = err.message || "Generation failed.";
      }
      if (!text) {
        card.textContent = "";
        card.classList.add("is-awaiting");
        card.textContent = error || "Could not generate. Press Space to try again.";
        hint.textContent = "Press Space to try again.";
        busy = false;
        return;
      }
      if (!card.textContent) {
        card.textContent = text;
      }
      card.classList.remove("is-awaiting");
      hasGenerated = true;
      remember(text);
      updateCardSource();
      busy = false;
      if (soundOn && gestured) {
        heardCurrent = true;
        speak(text);
      }
      idleHint();
    }

    function requestNext() {
      gestured = true;
      if (busy) return;
      if (soundOn && card.textContent && !heardCurrent) {
        heardCurrent = true;
        speak(card.textContent);
        idleHint();
        return;
      }
      nextCard();
    }

    initTheme();
    const bootParams = params();
    if (bootParams.id) {
      focusConceptId = bootParams.id;
      focusConceptName = bootParams.name || bootParams.id.replace(/_/g, " ");
      initFocusConcept();
    }
    fillLanguages();
    syncSoundButton();
    langSelect.addEventListener("click", (e) => e.stopPropagation());
    langSelect.addEventListener("change", () => {
      const next = findLanguage(langSelect.value);
      if (next.id === currentLang.id) return;
      applyLanguage(next);
      recent.length = 0;
      heardCurrent = false;
      if (hasGenerated && !busy) nextCard();
    });
    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      soundOn = !soundOn;
      localStorage.setItem("hi-enact-sound", soundOn ? "on" : "off");
      syncSoundButton();
      if (!soundOn) {
        stopSpeak();
        teardownVoice();
      } else if (card.textContent) {
        gestured = true;
        heardCurrent = true;
        speak(card.textContent);
      }
      idleHint();
    });
    document.getElementById("stage").addEventListener("click", requestNext);
    window.addEventListener("keydown", (e) => {
      if (e.target === langSelect) return;
      if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") {
        e.preventDefault();
        requestNext();
      }
    });
    window.addEventListener("pagehide", teardownVoice);
    loadFocusFromOntology().then(() => {
      showAwaitingCard();
      idleHint();
    });
  </script>
</body>
</html>
