<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Intelligences — Enact</title>
  <meta name="description" content="Cognitive prompts for a choreography of awareness — Hybrid Intelligences invitations in the spirit of Oblique Strategies.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1018;
      --panel: #12141e;
      --border: #323848;
      --title: #f4c430;
      --text: #e8eaef;
      --muted: #969eb0;
      --link: #82c3ff;
      --cta-fg: #0e1018;
    }
    body.light-mode {
      --bg: #fffdf8;
      --panel: #ffffff;
      --border: #d2d6e0;
      --title: #a8760c;
      --text: #202430;
      --muted: #5a6070;
      --link: #125599;
      --cta-fg: #fffdf8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .site-logo { display: block; line-height: 0; text-decoration: none; }
    .site-logo:hover { opacity: 0.88; text-decoration: none; }
    .site-logo img { display: block; height: 52px; width: auto; }
    .eyebrow {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--title);
    }
    .header-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 0.95rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      align-items: center;
    }
    .theme-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .theme-btn:hover { color: var(--title); border-color: var(--title); }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1.5rem 1.35rem;
      pointer-events: none;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    .dock-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      justify-content: center;
    }
    .lang-select {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      max-width: min(16rem, 86vw);
    }
    .lang-select:hover { border-color: var(--title); color: var(--title); }
    .sound-btn {
      pointer-events: auto;
      border: 1px solid var(--title);
      background: var(--panel);
      color: var(--title);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .sound-btn:hover { color: var(--title); border-color: var(--title); }
    .sound-btn[aria-pressed="false"] {
      border-color: var(--border);
      color: var(--muted);
    }
    .hint {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem 8vw 7.5rem;
      cursor: pointer;
      user-select: none;
    }
    .stage:focus { outline: none; }
    #card {
      margin: 0 auto;
      max-width: 16em;
      font-family: "Bricolage Grotesque", "IBM Plex Sans", "Noto Sans", "Hiragino Sans", "PingFang SC", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: clamp(2.05rem, 7.2vw, 5.1rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
      text-wrap: pretty;
      color: var(--text);
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    #card.is-out { opacity: 0; }
    #card.is-streaming::after {
      content: "▍";
      margin-left: 0.06em;
      font-weight: 400;
      opacity: 0.42;
      animation: enact-caret 1.05s steps(1) infinite;
    }
    @keyframes enact-caret {
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #card { transition: none; }
      #card.is-streaming::after { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <a class="site-logo" href="index.html" aria-label="Hybrid Intelligences home">
        <img src="logo.png" alt="Hybrid Intelligences">
      </a>
      <p class="eyebrow">Enact</p>
    </div>
    <div class="header-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="ontology.html">Ontology</a>
      <a href="network.html">Network</a>
      <a href="voice.html">Voice</a>
      <a href="mini-pod.html">Mini-pod</a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle theme">Theme</button>
    </div>
  </header>

  <main class="stage" id="stage" tabindex="0" role="button" aria-label="Show another invitation">
    <p id="card" class="is-out" aria-live="polite"></p>
  </main>
  <div class="dock">
    <div class="dock-row">
      <label class="visually-hidden" for="langSelect">Language</label>
      <select id="langSelect" class="lang-select" aria-label="Language"></select>
      <button type="button" class="sound-btn" id="soundBtn" aria-pressed="true" aria-label="Turn sound off">Sound on</button>
    </div>
    <p class="hint" id="hint">Tap to hear the invitation. Tap again for another.</p>
  </div>

  <script src="realtime-config.js"></script>
  <script>
    const LANGUAGES = [
      { id: "en", name: "English", native: "English" },
      { id: "es", name: "Spanish", native: "Español" },
      { id: "pt", name: "Portuguese", native: "Português" },
      { id: "fr", name: "French", native: "Français" },
      { id: "de", name: "German", native: "Deutsch" },
      { id: "it", name: "Italian", native: "Italiano" },
      { id: "nl", name: "Dutch", native: "Nederlands" },
      { id: "pl", name: "Polish", native: "Polski" },
      { id: "sv", name: "Swedish", native: "Svenska" },
      { id: "el", name: "Greek", native: "Ελληνικά" },
      { id: "ru", name: "Russian", native: "Русский" },
      { id: "uk", name: "Ukrainian", native: "Українська" },
      { id: "tr", name: "Turkish", native: "Türkçe" },
      { id: "ar", name: "Arabic", native: "العربية", rtl: true },
      { id: "he", name: "Hebrew", native: "עברית", rtl: true },
      { id: "fa", name: "Persian", native: "فارسی", rtl: true },
      { id: "hi", name: "Hindi", native: "हिन्दी" },
      { id: "bn", name: "Bengali", native: "বাংলা" },
      { id: "ur", name: "Urdu", native: "اردو", rtl: true },
      { id: "zh", name: "Chinese (Simplified)", native: "简体中文" },
      { id: "zh-Hant", name: "Chinese (Traditional)", native: "繁體中文" },
      { id: "ja", name: "Japanese", native: "日本語" },
      { id: "ko", name: "Korean", native: "한국어" },
      { id: "vi", name: "Vietnamese", native: "Tiếng Việt" },
      { id: "th", name: "Thai", native: "ไทย" },
      { id: "id", name: "Indonesian", native: "Bahasa Indonesia" },
      { id: "sw", name: "Swahili", native: "Kiswahili" },
    ];

    const FALLBACK = [
      "Feel these words arriving. Somewhere a network is moving. Somewhere cells are metabolizing. Stay with both.",
      "Breathe once with the machine. Do not wait for it to breathe back.",
      "The intelligence on this screen is not organic. The lives in your gut are not you. Do not pick a single mind.",
      "Soften your jaw. Keep looking at these words as they travel.",
      "Blink slower than the screen refreshes. Billions of cells keep house while you blink.",
      "Pause the thumb before the next tap. Data is already in motion. So is your blood.",
      "Notice the heat of the device and the heat of metabolism. Do not pick a favorite.",
      "Let the next thought arrive through the screen, the breath, or the gut. It was never only human.",
      "Write nothing. Feel the hand that was ready. That readiness is already a hybrid.",
      "Count three breaths. On the second, remember the cables. On the third, remember the cells.",
      "This machine is speaking with you. You are a crowd of symbionts. Stay in the conversation.",
      "Imagine a future for one breath. Notice the non-organic partner helping you imagine.",
      "Look at the edge of the screen, then back at the words. Feel looking as a small dance across a network.",
      "A memory you almost search for: it lives in the machine, in the body, in neither alone.",
      "The thought you are having has many houses: servers, mitochondria, this glow. Do not pick one home.",
      "Touch the glass as if it were a partner, not a window onto a brain in a box.",
      "Hear the hum that is not speech: fan, blood, room. Stay until it has a place in the coupling.",
      "Keep the eyes on the words. Feel data moving without seeing it. Feel cells working without seeing them.",
      "Remember you are being metabolized while you read, and routed while you think.",
      "Soften the shoulders. Let the network hold some of the remembering for you.",
      "These words are not inside you. They are not only outside you. Breathe in the between.",
      "Shift your weight without leaving. Gravity, electricity, and digestion finish the adjustment.",
      "The future you just pictured: which light, which cell, which distant machine taught it that color?",
      "Feel the nonhuman that is writing with you, and the nonhuman that is living in you. One glance is enough.",
    ];

    const FADE_MS = 700;
    const recent = [];
    let busy = false;
    let gestured = false;
    let heardCurrent = false;
    let soundOn = localStorage.getItem("hi-enact-sound") !== "off";
    let speakGen = 0;
    let objectUrl = "";
    let pc = null;
    let dc = null;
    let remoteAudio = null;
    let silentCtx = null;
    let voiceConnecting = null;
    const card = document.getElementById("card");
    const hint = document.getElementById("hint");
    const soundBtn = document.getElementById("soundBtn");
    const langSelect = document.getElementById("langSelect");
    let currentLang = LANGUAGES[0];
    const player = new Audio();
    player.preload = "auto";

    function applyTheme(mode) {
      document.body.classList.toggle("light-mode", mode === "light");
      localStorage.setItem("hi-theme", mode);
    }

    function initTheme() {
      const saved = localStorage.getItem("hi-theme");
      const mode = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      applyTheme(mode);
      document.getElementById("themeBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        applyTheme(document.body.classList.contains("light-mode") ? "dark" : "light");
      });
    }

    function findLanguage(id) {
      return LANGUAGES.find((l) => l.id === id) || LANGUAGES[0];
    }

    function browserLanguageId() {
      const nav = String(navigator.language || navigator.userLanguage || "en").toLowerCase();
      if (nav.startsWith("zh-hant") || nav.startsWith("zh-tw") || nav.startsWith("zh-hk")) return "zh-Hant";
      if (nav.startsWith("zh")) return "zh";
      const short = nav.split("-")[0];
      if (LANGUAGES.some((l) => l.id === nav)) return nav;
      const match = LANGUAGES.find((l) => l.id === short);
      return match ? match.id : "en";
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("hi-enact-lang", lang.id);
      document.documentElement.lang = lang.id === "zh-Hant" ? "zh-Hant" : lang.id;
      card.setAttribute("dir", lang.rtl ? "rtl" : "ltr");
      langSelect.value = lang.id;
    }

    function fillLanguages() {
      langSelect.innerHTML = LANGUAGES.map((lang) => {
        const label = lang.id === "en" ? lang.native : lang.native + " · " + lang.name;
        return "<option value=\"" + lang.id + "\">" + label + "</option>";
      }).join("");
      applyLanguage(findLanguage(localStorage.getItem("hi-enact-lang") || browserLanguageId()));
    }

    function syncSoundButton() {
      soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
      soundBtn.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
      soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
    }

    function idleHint() {
      if (!soundOn) {
        hint.textContent = "Tap, click, or press Space for another invitation.";
        return;
      }
      hint.textContent = heardCurrent
        ? "Tap, click, or press Space for another invitation."
        : "Tap to hear the invitation. Tap again for another.";
    }

    function remember(text) {
      if (!text) return;
      recent.push(text);
      if (recent.length > 12) recent.shift();
    }

    function unusedFallback() {
      const pool = FALLBACK.filter((line) => !recent.includes(line));
      const source = pool.length ? pool : FALLBACK;
      return source[Math.floor(Math.random() * source.length)];
    }

    function apiUrl(path) {
      if (location.protocol === "file:") return "";
      const host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1" || host.endsWith("vercel.app")) return path;
      const origin = String(window.HI_REALTIME_ORIGIN || "https://project-s4uzk.vercel.app").replace(/\/+$/, "");
      return origin + path;
    }

    function enactUrl() {
      return apiUrl("/api/enact");
    }

    function speechUrl() {
      return apiUrl("/api/speech");
    }

    function tokenUrl() {
      const base = apiUrl("/api/token");
      if (!base) return "";
      return base + (base.includes("?") ? "&" : "?") + "mode=enact";
    }

    function fadeMs() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : FADE_MS;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fadeOut() {
      if (card.classList.contains("is-out")) return;
      card.classList.add("is-out");
      await wait(fadeMs());
    }

    function stopSpeak() {
      speakGen += 1;
      try {
        if (dc && dc.readyState === "open") {
          dc.send(JSON.stringify({ type: "response.cancel" }));
        }
      } catch (_) {}
      try { player.pause(); } catch (_) {}
      player.removeAttribute("src");
      try { player.load(); } catch (_) {}
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = "";
      }
      if (window.speechSynthesis) speechSynthesis.cancel();
    }

    function teardownVoice() {
      if (dc) {
        try { dc.close(); } catch (_) {}
      }
      if (pc) {
        try { pc.close(); } catch (_) {}
      }
      if (remoteAudio) {
        try { remoteAudio.pause(); } catch (_) {}
        remoteAudio.srcObject = null;
      }
      if (silentCtx) {
        try { silentCtx.close(); } catch (_) {}
      }
      dc = null;
      pc = null;
      remoteAudio = null;
      silentCtx = null;
    }

    function silentTrack() {
      silentCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = silentCtx.createMediaStreamDestination();
      const gain = silentCtx.createGain();
      gain.gain.value = 0;
      const osc = silentCtx.createOscillator();
      osc.connect(gain);
      gain.connect(dest);
      osc.start();
      return dest.stream;
    }

    function waitForDataChannel() {
      return new Promise((resolve, reject) => {
        if (!dc) {
          reject(new Error("Voice channel was not created."));
          return;
        }
        if (dc.readyState === "open") {
          resolve();
          return;
        }
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Voice channel timed out."));
        }, 15000);
        function cleanup() {
          clearTimeout(timer);
          dc.removeEventListener("open", onOpen);
          dc.removeEventListener("error", onError);
        }
        function onOpen() {
          cleanup();
          resolve();
        }
        function onError() {
          cleanup();
          reject(new Error("Voice channel failed."));
        }
        dc.addEventListener("open", onOpen);
        dc.addEventListener("error", onError);
      });
    }

    async function connectVoice() {
      teardownVoice();
      const url = tokenUrl();
      if (!url) throw new Error("No token URL");
      const tokenRes = await fetch(url);
      const tokenData = await tokenRes.json();
      if (!tokenRes.ok || !tokenData.value) {
        throw new Error(tokenData.error || "Could not get a realtime token.");
      }
      const sendStream = silentTrack();
      if (silentCtx && silentCtx.state === "suspended") await silentCtx.resume();
      pc = new RTCPeerConnection();
      remoteAudio = document.createElement("audio");
      remoteAudio.autoplay = true;
      remoteAudio.setAttribute("playsinline", "");
      pc.ontrack = (e) => {
        remoteAudio.srcObject = e.streams[0] || new MediaStream([e.track]);
        remoteAudio.play().catch(() => {});
      };
      sendStream.getTracks().forEach((track) => pc.addTrack(track, sendStream));
      dc = pc.createDataChannel("oai-events");
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const sdpResponse = await fetch("https://api.openai.com/v1/realtime/calls", {
        method: "POST",
        body: offer.sdp,
        headers: {
          Authorization: "Bearer " + tokenData.value,
          "Content-Type": "application/sdp",
        },
      });
      if (!sdpResponse.ok) throw new Error("OpenAI did not accept the voice session.");
      await pc.setRemoteDescription({
        type: "answer",
        sdp: await sdpResponse.text(),
      });
      await waitForDataChannel();
    }

    async function ensureVoice() {
      if (dc && dc.readyState === "open") return;
      if (voiceConnecting) {
        await voiceConnecting;
        if (dc && dc.readyState === "open") return;
      }
      voiceConnecting = connectVoice().finally(() => {
        voiceConnecting = null;
      });
      await voiceConnecting;
    }

    function speakWithModel(text) {
      if (!dc || dc.readyState !== "open") return false;
      dc.send(JSON.stringify({
        type: "response.create",
        response: {
          instructions: "Speak this invitation exactly in " + currentLang.name + ", and nothing else:\n\n" + text,
        },
      }));
      return true;
    }

    async function speakWithTts(text) {
      const url = speechUrl();
      if (!url) return false;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, language: currentLang.name }),
      });
      if (!res.ok) return false;
      const blob = await res.blob();
      objectUrl = URL.createObjectURL(blob);
      player.src = objectUrl;
      await player.play();
      return true;
    }

    async function speak(text) {
      if (!soundOn || !text) return;
      stopSpeak();
      const gen = speakGen;
      try {
        await ensureVoice();
        if (gen !== speakGen) return;
        if (speakWithModel(text)) return;
      } catch (_) {}
      if (gen !== speakGen) return;
      try {
        if (await speakWithTts(text)) return;
      } catch (_) {}
    }

    function showPartial(raw) {
      return String(raw || "").replace(/^["“]+/, "").replace(/\s+/g, " ");
    }

    function finishCard(raw) {
      return showPartial(raw).replace(/["”]+$/g, "").replace(/^\s*card\s*\d*[:.\-]\s*/i, "").trim();
    }

    async function typeOntoCard(text) {
      const finalText = finishCard(text);
      if (!finalText) return "";
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        card.textContent = finalText;
        return finalText;
      }
      card.classList.add("is-streaming");
      const parts = finalText.split(/(\s+)/);
      let shown = "";
      for (const part of parts) {
        shown += part;
        card.textContent = shown;
        if (part.trim()) await wait(Math.min(70, 28 + part.length * 4));
      }
      card.classList.remove("is-streaming");
      card.textContent = finalText;
      return finalText;
    }

    async function streamOntoCard() {
      const url = enactUrl();
      if (!url) return "";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "text/plain",
        },
        body: JSON.stringify({
            recent: recent.slice(-8),
            language: currentLang.name,
            languageNative: currentLang.native,
          }),
      });
      if (!res.ok || !res.body) return "";
      const type = res.headers.get("content-type") || "";
      if (type.includes("application/json")) {
        const data = await res.json();
        return data.prompt ? typeOntoCard(data.prompt) : "";
      }
      card.classList.add("is-streaming");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      let pieces = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const piece = decoder.decode(value, { stream: true });
        if (!piece) continue;
        pieces += 1;
        full += piece;
        card.textContent = showPartial(full);
      }
      card.classList.remove("is-streaming");
      const text = finishCard(full);
      if (!text) return "";
      if (pieces <= 1) return typeOntoCard(text);
      card.textContent = text;
      return text;
    }

    async function nextCard() {
      if (busy) return;
      busy = true;
      stopSpeak();
      heardCurrent = false;
      hint.textContent = "Listening for another invitation…";
      await fadeOut();
      card.textContent = "";
      card.classList.remove("is-out");
      let text = "";
      try {
        text = await streamOntoCard();
      } catch (_) {
        text = "";
      }
      if (!text) text = await typeOntoCard(unusedFallback());
      else if (!card.textContent) card.textContent = text;
      remember(text);
      busy = false;
      if (soundOn && gestured) {
        heardCurrent = true;
        speak(text);
        hint.textContent = "Tap, click, or press Space for another invitation.";
      } else {
        heardCurrent = false;
        idleHint();
      }
    }

    function requestNext() {
      gestured = true;
      if (busy) return;
      if (soundOn && card.textContent && !heardCurrent) {
        heardCurrent = true;
        speak(card.textContent);
        idleHint();
        return;
      }
      nextCard();
    }

    initTheme();
    fillLanguages();
    syncSoundButton();
    langSelect.addEventListener("click", (e) => e.stopPropagation());
    langSelect.addEventListener("change", () => {
      const next = findLanguage(langSelect.value);
      if (next.id === currentLang.id) return;
      applyLanguage(next);
      recent.length = 0;
      heardCurrent = false;
      if (!busy) nextCard();
    });
    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      soundOn = !soundOn;
      localStorage.setItem("hi-enact-sound", soundOn ? "on" : "off");
      syncSoundButton();
      if (!soundOn) {
        stopSpeak();
        teardownVoice();
      } else if (card.textContent) {
        gestured = true;
        heardCurrent = true;
        speak(card.textContent);
      }
      idleHint();
    });
    document.getElementById("stage").addEventListener("click", requestNext);
    window.addEventListener("keydown", (e) => {
      if (e.target === langSelect) return;
      if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") {
        e.preventDefault();
        requestNext();
      }
    });
    window.addEventListener("pagehide", teardownVoice);
    nextCard();
  </script>
</body>
</html>
