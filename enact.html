<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Intelligences — Enact</title>
  <meta name="description" content="Cognitive prompts for a choreography of awareness — Hybrid Intelligences invitations in the spirit of Oblique Strategies.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1018;
      --panel: #12141e;
      --border: #323848;
      --title: #f4c430;
      --text: #e8eaef;
      --muted: #969eb0;
      --link: #82c3ff;
      --cta-fg: #0e1018;
    }
    body.light-mode {
      --bg: #fffdf8;
      --panel: #ffffff;
      --border: #d2d6e0;
      --title: #a8760c;
      --text: #202430;
      --muted: #5a6070;
      --link: #125599;
      --cta-fg: #fffdf8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .site-logo { display: block; line-height: 0; text-decoration: none; }
    .site-logo:hover { opacity: 0.88; text-decoration: none; }
    .site-logo img { display: block; height: 52px; width: auto; }
    .eyebrow {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--title);
    }
    .header-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 0.95rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      align-items: center;
    }
    .theme-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .theme-btn:hover { color: var(--title); border-color: var(--title); }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1.5rem 1.35rem;
      pointer-events: none;
    }
    .sound-btn {
      pointer-events: auto;
      border: 1px solid var(--title);
      background: var(--panel);
      color: var(--title);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .sound-btn:hover { color: var(--title); border-color: var(--title); }
    .sound-btn[aria-pressed="false"] {
      border-color: var(--border);
      color: var(--muted);
    }
    .hint {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem 8vw 7.5rem;
      cursor: pointer;
      user-select: none;
    }
    .stage:focus { outline: none; }
    #card {
      margin: 0 auto;
      max-width: 16em;
      font-family: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: clamp(2.05rem, 7.2vw, 5.1rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
      text-wrap: pretty;
      color: var(--text);
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    #card.is-out { opacity: 0; }
    #card.is-streaming::after {
      content: "▍";
      margin-left: 0.06em;
      font-weight: 400;
      opacity: 0.42;
      animation: enact-caret 1.05s steps(1) infinite;
    }
    @keyframes enact-caret {
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #card { transition: none; }
      #card.is-streaming::after { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <a class="site-logo" href="index.html" aria-label="Hybrid Intelligences home">
        <img src="logo.png" alt="Hybrid Intelligences">
      </a>
      <p class="eyebrow">Enact</p>
    </div>
    <div class="header-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="ontology.html">Ontology</a>
      <a href="network.html">Network</a>
      <a href="voice.html">Voice</a>
      <a href="mini-pod.html">Mini-pod</a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle theme">Theme</button>
    </div>
  </header>

  <main class="stage" id="stage" tabindex="0" role="button" aria-label="Show another invitation">
    <p id="card" class="is-out" aria-live="polite"></p>
  </main>
  <div class="dock">
    <button type="button" class="sound-btn" id="soundBtn" aria-pressed="true" aria-label="Turn sound off">Sound on</button>
    <p class="hint" id="hint">Tap to hear the invitation. Tap again for another.</p>
  </div>

  <script src="realtime-config.js"></script>
  <script>
    const FALLBACK = [
      "Feel the phone in your hand and the air on the back of your neck as one weather.",
      "Look from a leaf, a cable, and a screen without ranking which is more alive.",
      "Let daylight and a notification occupy the same second. Do not choose.",
      "Place a palm on a window. Notice glass, weather, and the signal behind the glass.",
      "Follow a cable until it disappears. Name, silently, the nearest living thing.",
      "Hear a bird or a vent and a device hum without picking a favorite.",
      "Take one step as if the floor, the network, and gravity were sharing the load.",
      "Feel the battery’s warmth and your own. Stay until they are not a contest.",
      "Water something living, or touch a plant. Do not dry your hands before the next key.",
      "Stand where indoor air meets outdoor air. Keep the device with you. Do not use it.",
      "Blink with the screen, then with the sky or a lamp. Let both refresh you.",
      "Feel the seam where skin meets plastic, wood, or glass. Stay until it is neither only yours nor only its.",
      "Name one infrastructure you are borrowing and one living process you are borrowing. Thank both.",
      "Let a fan, a breeze, and a speaker be the same room. Soften your jaw.",
      "Look at a tool until it looks back as a condition, like weather, not an object.",
      "Count three breaths with the room: body, building, and whatever is charging nearby.",
      "Reach toward a plant or a window, then stop halfway. Notice the device still in the other hand.",
      "Listen for the hum that is not music: server, fridge, insect, blood. Stay until it has a location.",
      "Walk to the nearest threshold. Let daylight and electric light meet on your face.",
      "Offer your attention to something that cannot thank you: soil, cable, dust, or a sleeping screen.",
      "Shift your weight onto the less familiar foot. Let the floor and the building finish the adjustment.",
      "Turn toward a person, a plant, or a device without addressing them. Notice the coupling anyway.",
      "Let the nearest screen complete its refresh. Watch a shadow or a leaf while you wait.",
      "Find a weight you are already carrying that is not muscle: a charge, a forecast, a deadline. Set one down.",
    ];

    const FADE_MS = 700;
    const recent = [];
    let busy = false;
    let gestured = false;
    let heardCurrent = false;
    let soundOn = localStorage.getItem("hi-enact-sound") !== "off";
    let speakGen = 0;
    let objectUrl = "";
    const card = document.getElementById("card");
    const hint = document.getElementById("hint");
    const soundBtn = document.getElementById("soundBtn");
    const player = new Audio();
    player.preload = "auto";

    function applyTheme(mode) {
      document.body.classList.toggle("light-mode", mode === "light");
      localStorage.setItem("hi-theme", mode);
    }

    function initTheme() {
      const saved = localStorage.getItem("hi-theme");
      const mode = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      applyTheme(mode);
      document.getElementById("themeBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        applyTheme(document.body.classList.contains("light-mode") ? "dark" : "light");
      });
    }

    function syncSoundButton() {
      soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
      soundBtn.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
      soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
    }

    function idleHint() {
      if (!soundOn) {
        hint.textContent = "Tap, click, or press Space for another invitation.";
        return;
      }
      hint.textContent = heardCurrent
        ? "Tap, click, or press Space for another invitation."
        : "Tap to hear the invitation. Tap again for another.";
    }

    function remember(text) {
      if (!text) return;
      recent.push(text);
      if (recent.length > 12) recent.shift();
    }

    function unusedFallback() {
      const pool = FALLBACK.filter((line) => !recent.includes(line));
      const source = pool.length ? pool : FALLBACK;
      return source[Math.floor(Math.random() * source.length)];
    }

    function apiUrl(path) {
      if (location.protocol === "file:") return "";
      const host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1" || host.endsWith("vercel.app")) return path;
      const origin = String(window.HI_REALTIME_ORIGIN || "https://project-s4uzk.vercel.app").replace(/\/+$/, "");
      return origin + path;
    }

    function enactUrl() {
      return apiUrl("/api/enact");
    }

    function speechUrl() {
      return apiUrl("/api/speech");
    }

    function fadeMs() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : FADE_MS;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fadeOut() {
      if (card.classList.contains("is-out")) return;
      card.classList.add("is-out");
      await wait(fadeMs());
    }

    function stopSpeak() {
      speakGen += 1;
      try { player.pause(); } catch (_) {}
      player.removeAttribute("src");
      try { player.load(); } catch (_) {}
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = "";
      }
      if (window.speechSynthesis) speechSynthesis.cancel();
    }

    function browserSpeak(text) {
      if (!window.speechSynthesis) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.88;
      utter.pitch = 0.96;
      const voices = speechSynthesis.getVoices();
      const preferred =
        voices.find((v) => /en/i.test(v.lang) && /Google|Samantha|Daniel|Karen|Martha|Moira/i.test(v.name)) ||
        voices.find((v) => /^en/i.test(v.lang));
      if (preferred) utter.voice = preferred;
      speechSynthesis.speak(utter);
    }

    async function speak(text) {
      if (!soundOn || !text) return;
      stopSpeak();
      const gen = speakGen;
      const url = speechUrl();
      if (url) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (gen !== speakGen) return;
          if (res.ok) {
            const blob = await res.blob();
            if (gen !== speakGen) return;
            objectUrl = URL.createObjectURL(blob);
            player.src = objectUrl;
            await player.play();
            return;
          }
        } catch (_) {}
      }
      if (gen !== speakGen) return;
      browserSpeak(text);
    }

    function showPartial(raw) {
      return String(raw || "").replace(/^["“]+/, "").replace(/\s+/g, " ");
    }

    function finishCard(raw) {
      return showPartial(raw).replace(/["”]+$/g, "").replace(/^\s*card\s*\d*[:.\-]\s*/i, "").trim();
    }

    async function typeOntoCard(text) {
      const finalText = finishCard(text);
      if (!finalText) return "";
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        card.textContent = finalText;
        return finalText;
      }
      card.classList.add("is-streaming");
      const parts = finalText.split(/(\s+)/);
      let shown = "";
      for (const part of parts) {
        shown += part;
        card.textContent = shown;
        if (part.trim()) await wait(Math.min(70, 28 + part.length * 4));
      }
      card.classList.remove("is-streaming");
      card.textContent = finalText;
      return finalText;
    }

    async function streamOntoCard() {
      const url = enactUrl();
      if (!url) return "";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "text/plain",
        },
        body: JSON.stringify({ recent: recent.slice(-8) }),
      });
      if (!res.ok || !res.body) return "";
      const type = res.headers.get("content-type") || "";
      if (type.includes("application/json")) {
        const data = await res.json();
        return data.prompt ? typeOntoCard(data.prompt) : "";
      }
      card.classList.add("is-streaming");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      let pieces = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const piece = decoder.decode(value, { stream: true });
        if (!piece) continue;
        pieces += 1;
        full += piece;
        card.textContent = showPartial(full);
      }
      card.classList.remove("is-streaming");
      const text = finishCard(full);
      if (!text) return "";
      if (pieces <= 1) return typeOntoCard(text);
      card.textContent = text;
      return text;
    }

    async function nextCard() {
      if (busy) return;
      busy = true;
      stopSpeak();
      heardCurrent = false;
      hint.textContent = "Listening for another invitation…";
      await fadeOut();
      card.textContent = "";
      card.classList.remove("is-out");
      let text = "";
      try {
        text = await streamOntoCard();
      } catch (_) {
        text = "";
      }
      if (!text) text = await typeOntoCard(unusedFallback());
      else if (!card.textContent) card.textContent = text;
      remember(text);
      busy = false;
      if (soundOn && gestured) {
        heardCurrent = true;
        speak(text);
        hint.textContent = "Tap, click, or press Space for another invitation.";
      } else {
        heardCurrent = false;
        idleHint();
      }
    }

    function requestNext() {
      gestured = true;
      if (busy) return;
      if (soundOn && card.textContent && !heardCurrent) {
        heardCurrent = true;
        speak(card.textContent);
        idleHint();
        return;
      }
      nextCard();
    }

    initTheme();
    syncSoundButton();
    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      soundOn = !soundOn;
      localStorage.setItem("hi-enact-sound", soundOn ? "on" : "off");
      syncSoundButton();
      if (!soundOn) {
        stopSpeak();
      } else if (card.textContent) {
        gestured = true;
        heardCurrent = true;
        speak(card.textContent);
      }
      idleHint();
    });
    document.getElementById("stage").addEventListener("click", requestNext);
    window.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") {
        e.preventDefault();
        requestNext();
      }
    });
    nextCard();
  </script>
</body>
</html>
