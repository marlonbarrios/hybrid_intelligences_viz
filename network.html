<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Intelligences — Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="hybrid-network.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0e1018;
            font-family: "IBM Plex Mono", "Courier New", monospace;
        }
        body.light-mode { background: #fffdf8; }
        canvas { display: block; position: relative; z-index: 1; }
        .site-logo {
            position: fixed;
            z-index: 8;
            top: 8px;
            left: 10px;
            line-height: 0;
            text-decoration: none;
        }
        .site-logo:hover { opacity: 0.9; }
        .site-logo img {
            display: block;
            height: 96px;
            width: auto;
        }
        @media (max-width: 720px) {
            .site-logo { top: 6px; left: 8px; }
            .site-logo img { height: 80px; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <a class="site-logo" href="index.html" aria-label="Hybrid Intelligences home">
        <img src="logo.png" alt="Hybrid Intelligences">
    </a>
</body>
</html>
